apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: staging
  labels:
    app.kubernetes.io/name: analytics-worker
    app.kubernetes.io/part-of: devops-ai-triage-toolkit

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-worker

  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-worker
        app.kubernetes.io/part-of: devops-ai-triage-toolkit

    spec:
      automountServiceAccountToken: false

      containers:
        - name: analytics-worker
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -u
            - -c

          args:
            - |
              import time

              print("INFO: Analytics worker started")

              while True:
                  time.sleep(30)

          resources:
            requests:
              cpu: "100"
              memory: 64Mi
            limits:
              cpu: "100"
              memory: 128Mi