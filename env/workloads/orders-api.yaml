apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: staging
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: devops-ai-triage-toolkit

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        app.kubernetes.io/part-of: devops-ai-triage-toolkit

    spec:
      automountServiceAccountToken: false

      containers:
        - name: orders-api
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -u
            - -c

          args:
            - |
              import os
              import sys
              import time

              print("INFO: Starting orders-api")
              print("INFO: Validating application configuration")

              database_url = os.getenv("DATABASE_URL")

              if not database_url:
                  print(
                      "ERROR: Required environment variable "
                      "DATABASE_URL is not configured",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              print("INFO: Application configuration validated")
              print("INFO: orders-api started successfully")

              while True:
                  time.sleep(30)

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi